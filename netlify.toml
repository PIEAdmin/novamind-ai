[build]
  publish = "dist"
  command = "npm install && cd netlify/functions && npm install && cd ../.. && npx vite build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[functions.generate]
  timeout = 26

[[redirects]]
  from = "/__/auth/*"
  to = "https://novamind-ai-5417c.firebaseapp.com/__/auth/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
